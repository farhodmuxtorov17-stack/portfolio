<!DOCTYPE html>
<html lang="uz">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uninetworks · Loyihalar portfeli 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0B0C;--ink2:#2E2E30;--grey:#8C8C88;--line:rgba(11,11,12,.12);--paper:#F3F2EE;--white:#fff;--yel:#FFD60A;--cob:#1F3FD1;
 --gov:#2448D8;--dig:#129A74;--sep:#B8741A;--hw:#E2402A;
 --f:"Inter Tight","Segoe UI",system-ui,sans-serif;--m:"IBM Plex Mono",ui-monospace,monospace;--e:cubic-bezier(.2,.8,.2,1);--pad:clamp(18px,4vw,64px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);color:var(--ink);background:var(--white);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}img,video{display:block;max-width:100%}
.m{font-family:var(--m);font-size:12px;letter-spacing:.02em}
.up{text-transform:uppercase;letter-spacing:.08em}
.w{max-width:1440px;margin:0 auto;padding:0 var(--pad)}

.ico{display:inline-grid;place-items:center;flex:none}.ico svg{width:100%;height:100%}
.itile{width:46px;height:46px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;background:#fff;flex:none}
.dark .itile,.hmi .itile{background:#141416;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
/* top */
.top{position:fixed;inset:0 0 auto;z-index:50;height:64px;display:flex;align-items:center;gap:20px;padding:0 var(--pad);background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.top.sc{border-color:var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-weight:600;letter-spacing:-.01em;font-size:16px;white-space:nowrap}
.logo .um{height:22px;width:auto;flex:none}
.logo .un{font-weight:800;letter-spacing:.02em;font-size:15px}.logo .un b{color:#E53137;font-weight:800}
.logo .lsep{width:1px;height:18px;background:currentColor;opacity:.25;margin:0 4px}
.logo .lbr{font-weight:500;opacity:.75}
.lockup{display:flex;align-items:center;gap:18px}.lockup img{height:clamp(44px,5vw,72px);width:auto}
.lockup div{line-height:1}.lockup b{display:block;font-size:clamp(26px,3vw,44px);font-weight:800;letter-spacing:.01em}.lockup b i{font-style:normal;color:#E53137}
.lockup small{display:block;font-family:var(--m);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);margin-top:8px}
.pager{font-family:var(--m);font-size:12px;color:var(--grey);display:flex;gap:8px;margin-left:16px}
.pager b{color:var(--ink);font-weight:500}
.sp{flex:1}
.tbtn{height:38px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tbtn.dk{background:var(--ink);color:#fff}
.tbtn.dk:hover{background:#2a2a2c}
.tbtn.ol{box-shadow:inset 0 0 0 1px var(--line)}
.tbtn.ol:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.lng{display:flex;gap:2px;font-family:var(--m);font-size:12px}
.lng button{padding:6px 8px;border-radius:999px;color:var(--grey)}
.lng button.on{color:var(--ink);background:var(--paper)}

/* index overlay */
.idx{position:fixed;inset:0;z-index:60;background:var(--ink);color:#fff;display:none;overflow:auto}
.idx.on{display:block;animation:fi .4s var(--e)}
@keyframes fi{from{opacity:0}to{opacity:1}}
.idx .hd{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad)}
.idx .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:40px;padding:40px var(--pad) 80px}
.idx h6{font-family:var(--m);font-weight:400;font-size:12px;color:#8C8C88;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:10px;margin-bottom:6px}
.idx a{display:flex;justify-content:space-between;gap:10px;padding:9px 0;font-size:20px;font-weight:500;letter-spacing:-.02em;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.07)}
.idx a span{font-family:var(--m);font-size:11.5px;color:#8C8C88;font-weight:400;letter-spacing:0;padding-top:6px}
.idx a:hover{color:var(--yel)}

/* sections */
section{position:relative}
.sec{padding:120px 0}
.kick{display:flex;align-items:center;gap:12px;font-family:var(--m);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.kick b{color:var(--ink);font-weight:500}
.kick i{flex:1;height:1px;background:var(--line)}
.h2{font-size:clamp(40px,5.4vw,92px);font-weight:500;letter-spacing:-.05em;line-height:.95;margin-top:26px}
.h2 em{font-style:normal;background:var(--yel);padding:0 .08em}
.lead{font-size:clamp(17px,1.35vw,21px);line-height:1.5;color:var(--ink2);max-width:46ch;font-weight:400}
.tw{display:grid;grid-template-columns:1.25fr .75fr;gap:56px;align-items:end;margin-bottom:56px}
.rv{opacity:0;transform:translateY(30px);transition:opacity 1s var(--e),transform 1s var(--e)}
.vis .rv{opacity:1;transform:none}
.vis .rv:nth-child(2){transition-delay:.08s}.vis .rv:nth-child(3){transition-delay:.16s}

/* cover */
.cover{padding-top:120px;min-height:100vh;display:flex;flex-direction:column}
.cv-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--m);font-size:12px;color:var(--grey)}
.year{font-size:clamp(150px,27vw,470px);font-weight:500;letter-spacing:-.075em;line-height:.8;margin:26px 0 0 -0.04em}
.cv-row{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:end;margin-top:38px}
.cv-row h1{font-size:clamp(30px,3.2vw,52px);font-weight:500;letter-spacing:-.035em;line-height:1.02}
.scrl{display:inline-flex;gap:8px;align-items:center;margin-top:18px;font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:4px}
.band{margin-top:64px;background:var(--yel);display:grid;grid-template-columns:repeat(5,1fr)}
.band div{padding:26px 26px 22px;border-right:1px solid rgba(11,11,12,.15)}
.band div:last-child{border-right:0}
.band b{display:block;font-size:clamp(48px,5vw,84px);font-weight:500;letter-spacing:-.05em;line-height:1}
.band span{display:block;margin-top:14px;font-size:14.5px;font-weight:500}
.band small{display:block;font-family:var(--m);font-size:11.5px;color:rgba(11,11,12,.6);margin-top:2px}

/* duotone */
.duo{position:relative;background:var(--cob);overflow:hidden}
.duo img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15) brightness(1.05);mix-blend-mode:luminosity;opacity:.95}
.duo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(31,63,209,.15),rgba(31,63,209,.55))}
.hl{color:#fff}
.hl .in{position:relative;z-index:2}
.hl .ph{position:absolute;inset:0}
.hlg{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(255,255,255,.35);margin-top:70px}
.hlg div{padding:22px 22px 0 0}
.hlg div+div{padding-left:22px;border-left:1px solid rgba(255,255,255,.25)}
.hlg b{display:block;font-size:clamp(44px,4.4vw,76px);font-weight:300;letter-spacing:-.05em;line-height:1}
.hlg span{display:block;font-size:15px;margin-top:12px;opacity:.85}

/* directions */
.dirs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink)}
.dir{padding:22px 24px 26px 0}
.dir+.dir{padding-left:24px;border-left:1px solid var(--line)}
.dir .n{display:flex;justify-content:space-between;align-items:baseline}
.dir .n b{font-size:64px;font-weight:300;letter-spacing:-.05em;line-height:1}
.dir .n span{font-family:var(--m);font-size:12px;display:flex;gap:7px;align-items:center}
.dir .n span i{width:9px;height:9px;border-radius:50%}
.dir h3{font-size:22px;font-weight:500;letter-spacing:-.025em;margin-top:14px;line-height:1.15}
.dir p{font-size:14px;color:var(--grey);margin-top:4px;min-height:2.6em}
.prj{display:grid;grid-template-columns:1fr auto;gap:6px 10px;width:100%;text-align:left;padding:13px 0;border-top:1px solid var(--line);transition:padding .3s var(--e)}
.prj:first-of-type{margin-top:16px}
.prj:hover{padding-left:6px}
.prj .t{font-weight:500;font-size:16px;letter-spacing:-.01em;display:flex;gap:8px;align-items:center}
.prj .v{font-family:var(--m);font-size:12.5px}
.ln{grid-column:1/-1;height:3px;background:var(--paper);position:relative}
.ln i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width 1.3s var(--e)}
.ln i.h{opacity:.3}
.nb{grid-column:1/-1;font-family:var(--m);font-size:11.5px;color:var(--grey)}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--m);font-size:11px;padding:3px 7px;border-radius:999px;background:var(--paper);white-space:nowrap}
.tag.y{background:var(--yel)}
.tag.k{background:var(--ink);color:#fff}
.tag.o{box-shadow:inset 0 0 0 1px var(--line);background:none}

/* funnel dark */
.dark{background:#080809;color:#EDEDEA}
.dark .kick{color:#8C8C88}.dark .kick b{color:#fff}.dark .kick i{background:rgba(255,255,255,.14)}
.dark .lead{color:#BDBDB8}
.fn{position:relative;padding-bottom:20px}
.fn .tier{display:grid;grid-template-columns:170px 1fr;gap:24px;align-items:stretch;margin-bottom:4px}
.fn .lab{border-top:1px solid rgba(255,255,255,.18);padding-top:12px}
.fn .lab b{display:block;font-size:38px;font-weight:300;letter-spacing:-.04em;line-height:1}
.fn .lab span{display:block;font-size:13.5px;color:#BDBDB8;margin-top:8px}
.fn .fband{position:relative;padding:22px 0;min-height:150px;display:flex;align-items:center}
.fn .fband::before{content:"";position:absolute;inset:0;clip-path:polygon(var(--a) 0,calc(100% - var(--a)) 0,calc(100% - var(--b)) 100%,var(--b) 100%);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03) 18%,rgba(255,255,255,.015))}
.fn .fband::after{content:"";position:absolute;left:var(--a);right:var(--a);top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)}
.fn .t1 .fband{--a:0%;--b:9%}.fn .t2 .fband{--a:9%;--b:19%}.fn .t3 .fband{--a:19%;--b:29%}
.fn .t3 .fband::before{background:linear-gradient(180deg,rgba(255,214,10,.34),rgba(255,214,10,.12))}
.fn .t3 .fband::after{background:linear-gradient(90deg,transparent,#FFD60A,transparent)}
.fn .row{position:relative;z-index:1;display:flex;justify-content:center;gap:10px;width:100%}
.fn .t1 .row{padding:0 10%}.fn .t2 .row{padding:0 22%}.fn .t3 .row{padding:0 31%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc{flex:1 1 0;min-width:0;text-align:left;background:#141416;border:1px solid rgba(255,255,255,.1);padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-height:108px;transition:transform .4s var(--e),border-color .3s}
.fc:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.35)}
.fc .tp{display:flex;justify-content:space-between;align-items:center;font-family:var(--m);font-size:11px;color:#8C8C88}
.fc h4{font-size:17px;font-weight:500;letter-spacing:-.02em;line-height:1.1;margin-top:12px}
.fc .pc{white-space:nowrap;font-size:clamp(18px,1.7vw,26px);font-weight:300;letter-spacing:-.04em;margin-top:4px}
.fc.s3{background:var(--yel);color:var(--ink);border-color:var(--yel)}
.fc.s3 .tp{color:rgba(11,11,12,.65)}
.spout{display:grid;grid-template-columns:170px 1fr;gap:24px}
.spout .sp2{display:flex;flex-direction:column;align-items:center}
.spout .neck{width:14%;height:46px;background:linear-gradient(180deg,rgba(255,214,10,.4),rgba(255,214,10,.08));clip-path:polygon(15% 0,85% 0,70% 100%,30% 100%)}
.spout .drop{width:12px;height:12px;border-radius:50%;background:var(--yel);margin-top:10px;box-shadow:0 0 0 6px rgba(255,214,10,.15);animation:dr 2.2s var(--e) infinite}
@keyframes dr{0%{transform:translateY(-10px);opacity:0}30%{opacity:1}100%{transform:translateY(16px);opacity:0}}
.spout .lb2{margin-top:18px;font-family:var(--m);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#BDBDB8;display:flex;align-items:center;gap:10px}
.spot{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(circle 380px at var(--mx,62%) var(--my,70%),rgba(8,8,9,0) 0,rgba(8,8,9,.08) 45%,rgba(8,8,9,.72) 100%);transition:opacity .5s}
.fn.lit .spot{opacity:0}
#pres .fn .fband{min-height:0;padding:14px 0}#pres .fn .tier{margin-bottom:2px}#pres .spout .neck{height:34px}
.sw{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;background:#1A1A1C;font-size:13.5px;margin-top:26px}
.sw i{width:34px;height:20px;border-radius:999px;background:#3A3A3C;position:relative;transition:background .3s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .3s var(--e)}
.sw.on i{background:var(--yel)}
.sw.on i::after{transform:translateX(14px)}

/* scale */
.sc{margin-top:10px}
.srow{display:grid;grid-template-columns:220px 1fr 80px;gap:20px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.srow:hover .sn{text-decoration:underline;text-underline-offset:4px}
.sn{font-size:17px;font-weight:500;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.sn i{width:8px;height:8px;border-radius:50%}
.st{position:relative;height:24px}
.st .zg{position:absolute;inset:0;display:grid;grid-template-columns:5fr 5fr 40fr 50fr}
.st .zg span{border-left:1px dashed var(--line)}
.st .zg span:nth-child(4){background:rgba(255,214,10,.16)}
.st .b{position:absolute;top:8px;height:8px;left:0;width:0;transition:width 1.3s var(--e)}
.st .b.h{opacity:.28}
.sv{font-family:var(--m);font-size:13px;text-align:right}
.sax{display:grid;grid-template-columns:220px 1fr 80px;gap:20px;border-top:1px solid var(--ink)}
.sax .a{position:relative;height:26px;font-family:var(--m);font-size:11px;color:var(--grey)}
.sax .a span{position:absolute;top:6px;transform:translateX(-50%)}

/* showcase */
.feat{display:grid;grid-template-columns:1.3fr .7fr;gap:0;background:var(--paper)}
.feat .md{background:#0A1519}
.feat .tx{padding:40px;display:flex;flex-direction:column}
.feat .tx h3{font-size:44px;font-weight:500;letter-spacing:-.04em;line-height:1;margin-top:18px}
.feat .tx p{color:var(--ink2);margin-top:16px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:36px 24px;margin-top:56px}
.card{text-align:left;display:flex;flex-direction:column}
.card .im{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--paper)}
.card .im img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--e)}
.card:hover .im img{transform:scale(1.045)}
.card .im .tag{position:absolute;left:12px;top:12px}
.card .im .pl{position:absolute;right:12px;bottom:12px;width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center}
.card .meta{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-family:var(--m);font-size:12px;color:var(--grey)}
.card .meta i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.card h4{font-size:26px;font-weight:500;letter-spacing:-.03em;line-height:1.05;margin-top:6px}
.card p{font-size:14.5px;color:var(--ink2);margin-top:8px}
.plate{width:100%;height:100%;display:grid;place-items:center;background:var(--paper);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}
.plate svg{width:80%;height:auto}

/* video */
.vid{position:relative;overflow:hidden;background:#000;aspect-ratio:16/9}
.vid video{width:100%;height:100%;object-fit:cover}
.vid .pl{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-between;padding:22px;color:#fff;cursor:pointer;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.6))}
.vid .pl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.vid .pl .pb{width:72px;height:72px;border-radius:50%;background:var(--yel);color:var(--ink);display:grid;place-items:center;transition:transform .35s var(--e)}
.vid .pl:hover .pb{transform:scale(1.07)}
.vid .pl .vt{font-size:16px;font-weight:500}
.vid .pl .vt small{display:block;font-family:var(--m);font-size:11.5px;opacity:.75;font-weight:400}
.vid.playing .pl{opacity:0;pointer-events:none}

/* hmi */
.hmi{background:#0C0D0E;color:#E9E9E6}
.hmi .kick{color:#8C8C88}.hmi .kick b{color:#fff}.hmi .kick i{background:rgba(255,255,255,.14)}
.hmi .lead{color:#BDBDB8}
.mod{display:grid;grid-template-columns:.8fr 1.2fr;gap:40px;padding:56px 0;border-top:1px solid rgba(255,255,255,.12)}
.mod h3{font-size:clamp(30px,2.8vw,46px);font-weight:500;letter-spacing:-.04em;line-height:1;margin-top:14px}
.mod .lead{font-size:16px;margin-top:14px}
.chk{margin-top:20px}
.chk li{list-style:none;display:grid;grid-template-columns:20px 1fr;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:14.5px;color:#D6D6D2}
.chk li b{font-family:var(--m);font-weight:500;color:var(--yel)}
.chk li.no b{color:#6F6F6B}
/* simulators */
.sim{border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-3);background:#0E0F11;color:#E9E9E6}
.sim .bar2{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.08);font-family:var(--m);font-size:11.5px;color:#A9A9A4}
.sim .bar2 b{color:#E9E9E6;font-weight:500}
.sim .bar2 .live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:#FF5A6E}
.sim .bar2 .live i{width:7px;height:7px;border-radius:50%;background:#FF3B54;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
.sim canvas{display:block;width:100%;height:auto}
.simg{display:grid;grid-template-columns:1fr 300px}
.op{border-left:1px solid rgba(255,255,255,.08);padding:14px;font-size:13px;display:flex;flex-direction:column;gap:12px;background:#121315}
.op h5{font-family:var(--m);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#8D8D88}
.op .blk{border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px 12px}
.op .blk .t{display:flex;justify-content:space-between;color:#BDBDB8;font-size:12.5px}
.op .nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.op .nums div span{display:block;font-size:11px;color:#8D8D88}
.op .nums div b{font-family:var(--f);font-weight:600;font-size:22px;color:#fff;font-variant-numeric:tabular-nums}
.op .cam{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid rgba(255,255,255,.06);font-family:var(--m);font-size:11.5px;color:#BDBDB8}
.op .cam i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3BE38A;margin-right:6px}
.op .cam.off i{background:#8D8D88}
.op .warn{color:#F1B04C}
.steps li{list-style:none;display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.06);font-size:12.5px;color:#BDBDB8}
.steps li i{width:10px;height:10px;border-radius:50%;border:1.5px solid #6F6F6B}
.steps li.done i{background:#3BE38A;border-color:#3BE38A}
.steps li.cur i{background:#FF3B54;border-color:#FF3B54;box-shadow:0 0 0 4px rgba(255,59,84,.2)}
.steps li.chk i{border-color:#F1B04C;border-style:dashed}
.steps li em{font-style:normal;font-family:var(--m);font-size:10.5px;color:#8D8D88}

function fit(){const st=$("#stage"),s=st.querySelector(".sl");if(!s)return;s.style.transform=`scale(${Math.min((st.clientWidth-20)/1600,(st.clientHeight-20)/900)})`}
function show(i){const ids=SL[pm]();pi=(i+ids.length)%ids.length;$$("#stage video").forEach(v=>v.pause());const [cls,h]=slide(ids[pi]);$("#stage").innerHTML=`<div class="sl ${cls}">${h}</div>`;wire($("#stage"));$$("#stage .sl section").forEach(s=>s.classList.add("vis"));fit();$("#pcn").textContent=`${pi+1} / ${ids.length}`;$("#pbi").style.width=((pi+1)/ids.length*100)+"%"}
$("#presBtn").onclick=()=>{$("#pres").classList.add("on");document.body.style.overflow="hidden";show(0)};
function closeP(){$("#pres").classList.remove("on");document.body.style.overflow="";$$("#stage video").forEach(v=>v.pause());$("#stage").innerHTML="";try{document.fullscreenElement&&document.exitFullscreen()}catch(_){}}
$("#pexit").onclick=closeP;$("#pprev").onclick=()=>show(pi-1);$("#pnext").onclick=()=>show(pi+1);

 if(e.key==="Escape"){$("#idx").classList.remove("on");$("#lb").classList.remove("on")}if(e.key==="f"||e.key==="F")$("#presBtn").click()});
